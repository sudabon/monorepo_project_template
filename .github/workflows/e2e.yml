name: E2E

# The smoke drives the SPA through the BFF into the API, so it runs on changes
# to any of them. It stays out of web.yml because path filters are per workflow,
# and a Go-only change must not drag the TypeScript unit job along (ADR 0001).
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/bff/**'
      - 'api/**'
      - 'packages/**'
      - 'go.work*'
      - 'compose.yaml'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'apps/bff/**'
      - 'api/**'
      - 'packages/**'
      - 'go.work*'
      - 'compose.yaml'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'scripts/**'
      - 'Makefile'
      - '.github/workflows/e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - run: make setup-web
      - run: make setup-go
      - run: pnpm exec playwright install --with-deps chromium
      - run: make e2e
        env:
          CI: true
