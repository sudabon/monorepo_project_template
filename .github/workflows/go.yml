name: Go

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'apps/api/**'
      - 'apps/bff/**'
      - 'packages/go-platform/**'
      - 'go.work*'
      - 'scripts/go-task.sh'
      - 'Makefile'
      - 'compose.yaml'
      - '.github/workflows/go.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'apps/api/**'
      - 'apps/bff/**'
      - 'packages/go-platform/**'
      - 'go.work*'
      - 'scripts/go-task.sh'
      - 'Makefile'
      - 'compose.yaml'
      - '.github/workflows/go.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_USER: template
          POSTGRES_PASSWORD: template
          POSTGRES_DB: template
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template -d template"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://template:template@localhost:5432/template?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/api/go.mod
          cache: false
      - run: make setup-go
      - run: make fmt-check-go
      - run: make lint-go
      - run: make gen-check-go
      # test-go runs every module in go.work, including apps/bff auth/session tests.
      - run: make test-go
      - run: make build-go
