name: E2E plan

# Always produce a result, including PRs that only change OpenSpec artifacts.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-plan:
    name: E2E plan guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: make test-toolchain
      - run: make check-test-plan
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
