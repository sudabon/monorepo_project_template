name: Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**' # Includes packages/api-client source, generated types, and type tests.
      - '!packages/go-platform/**' # Go-only module; covered by the Go workflow.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'biome.json'
      - 'playwright.config.ts'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**' # Includes packages/api-client source, generated types, and type tests.
      - '!packages/go-platform/**' # Go-only module; covered by the Go workflow.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'biome.json'
      - 'playwright.config.ts'
      - 'scripts/**'
      - 'tests/**'
      - 'Makefile'
      - '.github/workflows/web.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm must be installed before setup-node so the pnpm store cache resolves.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: make setup-web
      - run: make fmt-check-web
      - run: make lint-web
      - run: make gen-check-web
      - run: make typecheck-web
      - run: make test-web
      - run: make build-web
