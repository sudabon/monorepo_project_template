name: Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'biome.json'
      - 'renovate.json'
      - 'scripts/check-toolchain.mjs'
      - 'tests/toolchain/**'
      - 'Makefile'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'biome.json'
      - 'renovate.json'
      - 'scripts/check-toolchain.mjs'
      - 'tests/toolchain/**'
      - 'Makefile'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - run: make setup-web
      - run: make fmt-check-web
      - run: make lint-web
      - run: make gen-check
      - run: make test-web
      - run: make build-web
