version: 3
workdir: .
allow:
  depOnAnyVendor: false
  # Enforce imports. Deep scanning treats concrete adapters passed to interfaces
  # as reverse dependencies, including the composition root and generated Echo DI.
  deepScan: false
excludeFiles:
  - '^.*_test\.go$'
vendors:
  # Shared runtime plumbing lives in its own module; see docs/adr/0006.
  platform: {in: github.com/sudabon/monorepo_project_template/packages/go-platform/**}
components:
  domain: {in: internal/domain/**}
  usecase: {in: internal/usecase/**}
  repository: {in: internal/repository/**}
  handler: {in: internal/handler/**}
  generated: {in: internal/generated/**}
  migrations: {in: migrations/**}
  testdb: {in: internal/testdb/**}
  main: {in: cmd/**}
deps:
  domain:
    mayDependOn: [domain]
  usecase:
    mayDependOn: [domain]
  repository:
    mayDependOn: [domain]
  handler:
    mayDependOn: [domain, usecase, generated]
    anyVendorDeps: true
  generated:
    anyVendorDeps: true
  migrations:
    anyVendorDeps: true
  testdb:
    mayDependOn: [migrations]
    anyVendorDeps: true
  main:
    mayDependOn: [handler, usecase, repository, migrations]
    anyVendorDeps: true
