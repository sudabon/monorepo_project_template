openapi: 3.0.3
info:
  title: Fixture
  version: 0.0.0
paths: {}
components:
  schemas:
    WidgetInput:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 40
          pattern: '^[^\x00]*$'
        note:
          type: string
          maxLength: 500
        ignored:
          type: integer
          maximum: 9
    Other:
      type: object
      properties:
        name:
          type: string
