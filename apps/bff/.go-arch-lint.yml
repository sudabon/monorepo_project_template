version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: false
excludeFiles:
  - '^.*_test\.go$'
vendors:
  # Shared runtime plumbing lives in its own module; see docs/adr/0006.
  platform: {in: github.com/sudabon/monorepo_project_template/packages/go-platform/**}
  echo: {in: github.com/labstack/echo/**}
  goose: {in: github.com/pressly/goose/**}
components:
  session: {in: internal/session/**}
  identity: {in: internal/identity/**}
  handler: {in: internal/handler/**}
  proxy: {in: internal/proxy/**}
  migrations: {in: migrations/**}
  main: {in: cmd/**}
deps:
  session:
    mayDependOn: [session]
  identity:
    mayDependOn: [identity]
  handler:
    mayDependOn: [session, identity, proxy]
    canUse: [platform, echo]
  # The proxy stays narrow: the session, the shared logger, and nothing else.
  proxy:
    mayDependOn: [session]
    canUse: [platform]
  migrations:
    canUse: [goose]
  main:
    mayDependOn: [handler, identity, session, migrations]
    canUse: [platform]
